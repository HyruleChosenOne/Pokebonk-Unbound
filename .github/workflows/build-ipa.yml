name: Build Experimental Apple (macOS Verify + Unsigned iOS IPA)

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'iOS edition to compile'
        type: choice
        required: true
        default: 'both'
        options:
          - both
          - complete
          - portable
      verify_macos:
        description: 'Verify existing macOS port builds, signs inside-out, and passes integrity checks first'
        type: boolean
        required: false
        default: true
      run_simulator_smoke:
        description: 'Run iOS Simulator compile/link smoke check before arm64 device IPA build'
        type: boolean
        required: false
        default: true
      source_repo:
        description: 'Private source repo (owner/name). Leave empty when running inside the private source repo itself.'
        type: string
        required: false
        default: ''
      upload_to_release:
        description: 'Upload resulting .ipa files to HyruleChosenOne/Pokebonk-Unbound experimental-apple release (requires RELEASE_TOKEN secret if running from another repo)'
        type: boolean
        required: false
        default: false

jobs:
  verify-macos:
    name: Verify macOS Port (arm64 Pack + Inside-Out Codesign)
    if: ${{ inputs.verify_macos }}
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout client source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo != '' && inputs.source_repo || github.repository }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN || github.token }}

      - name: Verify private client sources are present
        shell: bash
        run: |
          if [ ! -f "scripts/build-mac.js" ] || [ ! -f "src/main/main.js" ] || [ ! -f "package.json" ]; then
            echo "::error::Client source files (scripts/build-mac.js, src/main/main.js, package.json) were not found in this checkout."
            echo "Push the full private workspace to a private GitHub repository or pass source_repo + PRIVATE_SOURCE_TOKEN."
            exit 1
          fi

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        shell: bash
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Run JS syntax & Apple manifest integrity checks on macOS
        shell: bash
        run: |
          set -euo pipefail
          for f in src/main/*.js src/server/*.js src/network/*.js src/android/*.js src/renderer/mobileSettings.js scripts/build-mac.js scripts/build-ios.js; do
            node --check "$f"
          done
          if [ -f "bundled-build/index.html" ] && [ -d "mods/hyrules-mods" ]; then
            npm test
          else
            echo "Skipping full offline-bundle npm test (bundled-build/ or mods/ not checked in)."
          fi

      - name: Build macOS Portable arm64 package
        shell: bash
        run: node scripts/build-mac.js --portable --arm64

      - name: Verify macOS .app bundle, inside-out ad-hoc codesign, and Mach-O slices
        shell: bash
        run: |
          set -euo pipefail
          MAC_ZIP=$(ls dist-mac/PokeBonk-Unbound-Portable-*-mac-arm64.zip | head -n 1)
          echo "Inspecting $MAC_ZIP..."
          STAGE="/tmp/pbu-mac-verify"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          ditto -x -k "$MAC_ZIP" "$STAGE"

          APP="$STAGE/PokeBonk Unbound.app"
          test -d "$APP"
          bash -n "$STAGE/First-Time-Setup-macOS.command"

          # Lint every Info.plist inside the bundle
          find "$APP" -name "Info.plist" -print0 | while IFS= read -r -d '' pl; do
            plutil -lint "$pl"
          done

          # Check Mach-O architecture of main executable and helpers
          lipo -info "$APP/Contents/MacOS/PokeBonk Unbound" | grep -q "arm64"
          for helper in "$APP/Contents/Frameworks/"*Helper*.app; do
            exec_name=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$helper/Contents/Info.plist")
            lipo -info "$helper/Contents/MacOS/$exec_name" | grep -q "arm64"
          done

          # Apply inside-out ad-hoc signing (same steps as First-Time-Setup-macOS.command)
          find "$APP/Contents/Frameworks" -type f \( -name "*.dylib" -o -name "chrome_crashpad_handler" -o -name "ShipIt" \) -print0 | while IFS= read -r -d '' bin; do
            codesign --force --sign - "$bin"
          done
          find "$APP/Contents/Frameworks" -maxdepth 1 -name "*.framework" -print0 | while IFS= read -r -d '' fw; do
            codesign --force --sign - "$fw"
          done
          find "$APP/Contents/Frameworks" -maxdepth 1 -name "*.app" -print0 | while IFS= read -r -d '' helper; do
            codesign --force --sign - "$helper"
          done
          codesign --force --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # Smoke-check embedded app.asar modules using the packaged macOS Electron binary in Node mode
          ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/PokeBonk Unbound" -e "
            const path = require('path');
            const asarRoot = path.join(process.argv[1], 'Contents', 'Resources', 'app.asar');
            const pkg = require(path.join(asarRoot, 'package.json'));
            require(path.join(asarRoot, 'src', 'server', 'localServer.js'));
            require(path.join(asarRoot, 'src', 'network', 'lanRelay.js'));
            console.log('macOS packaged app.asar load OK:', pkg.name, pkg.version, process.platform, process.arch);
          " "$APP"
          rm -rf "$STAGE"

      - name: Upload verified macOS Portable arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokebonk-unbound-macos-portable-arm64
          path: dist-mac/PokeBonk-Unbound-Portable-*-mac-arm64.zip
          if-no-files-found: error
          retention-days: 14

  build-ios-ipa:
    name: Build Unsigned iOS IPA (${{ inputs.edition }})
    needs: [verify-macos]
    if: ${{ always() && (needs.verify-macos.result == 'success' || needs.verify-macos.result == 'skipped') }}
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout client source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo != '' && inputs.source_repo || github.repository }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN || github.token }}

      - name: Verify private client sources are present
        shell: bash
        run: |
          if [ ! -f "ios/project.yml" ] || [ ! -f "scripts/build-ios.js" ] || [ ! -f "package.json" ]; then
            echo "::error::Client source files (ios/project.yml, scripts/build-ios.js, package.json) were not found in this checkout."
            echo "Because the public HyruleChosenOne/Pokebonk-Unbound repository intentionally excludes private client source code:"
            echo "  Option A (Recommended): Push the full private workspace (including .github/workflows/build-ipa.yml) to a private GitHub repository and run this workflow there."
            echo "  Option B: Add a PRIVATE_SOURCE_TOKEN PAT secret with read access to your private source repo and pass owner/private-repo in the source_repo input."
            exit 1
          fi

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install production Node dependencies
        shell: bash
        run: |
          npm ci --omit=dev --no-audit --no-fund || npm install --omit=dev --no-audit --no-fund

      - name: Install XcodeGen & inspect Xcode toolchain
        shell: bash
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version
          xcodebuild -version
          xcodebuild -showsdks

      - name: Cache NodeMobile iOS XCFramework
        uses: actions/cache@v4
        with:
          path: ios/Frameworks/NodeMobile.xcframework
          key: nodemobile-ios-v18.20.4

      - name: Prepare bundled offline game assets (Complete edition)
        if: inputs.edition == 'complete' || inputs.edition == 'both'
        shell: bash
        run: |
          if [ ! -f "bundled-build/index.html" ]; then
            echo "bundled-build/ not found in repo — running npm run bundle:offline..."
            npm run bundle:offline
          else
            echo "Using existing bundled-build/ snapshot."
          fi

      - name: iOS Simulator compile & link smoke check
        if: ${{ inputs.run_simulator_smoke }}
        shell: bash
        run: node scripts/build-ios.js --simulator

      - name: Build unsigned arm64 iOS IPA(s)
        shell: bash
        run: |
          case "${{ inputs.edition }}" in
            complete)
              node scripts/build-ios.js --complete
              ;;
            portable)
              node scripts/build-ios.js --portable
              ;;
            both)
              node scripts/build-ios.js --all
              ;;
            *)
              echo "::error::Unknown edition: ${{ inputs.edition }}"
              exit 1
              ;;
          esac

      - name: Verify unsigned IPA package, Info.plist, and arm64 Mach-O integrity
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist-ios/*.ipa
          for ipa in dist-ios/*.ipa; do
            echo "=== Inspecting $ipa ==="
            entries=$(unzip -Z1 "$ipa")
            echo "$entries" | grep -q "^Payload/PokeBonkUnbound.app/PokeBonkUnbound$" || { echo "::error::Missing Mach-O executable in $ipa"; exit 1; }
            echo "$entries" | grep -q "^Payload/PokeBonkUnbound.app/Info.plist$" || { echo "::error::Missing Info.plist in $ipa"; exit 1; }
            echo "$entries" | grep -q "^Payload/PokeBonkUnbound.app/nodejs-project.zip$" || { echo "::error::Missing nodejs-project.zip in $ipa"; exit 1; }
            echo "$entries" | grep -q "^Payload/PokeBonkUnbound.app/Frameworks/NodeMobile.framework/NodeMobile$" || { echo "::error::Missing embedded NodeMobile.framework in $ipa"; exit 1; }
            if [[ "$ipa" == *"Complete"* ]]; then
              echo "$entries" | grep -q "^Payload/PokeBonkUnbound.app/bundled-build.zip$" || { echo "::error::Complete IPA missing bundled-build.zip in $ipa"; exit 1; }
            fi

            TMP_CHECK="/tmp/pbu-ipa-check"
            rm -rf "$TMP_CHECK"
            mkdir -p "$TMP_CHECK"
            unzip -q "$ipa" \
              "Payload/PokeBonkUnbound.app/PokeBonkUnbound" \
              "Payload/PokeBonkUnbound.app/Info.plist" \
              "Payload/PokeBonkUnbound.app/Frameworks/NodeMobile.framework/NodeMobile" \
              -d "$TMP_CHECK"

            plutil -lint "$TMP_CHECK/Payload/PokeBonkUnbound.app/Info.plist"
            PLIST_XML=$(plutil -convert xml1 -o - "$TMP_CHECK/Payload/PokeBonkUnbound.app/Info.plist")
            echo "$PLIST_XML" | grep -q "UIApplicationSceneManifest" || { echo "::error::Info.plist missing UIApplicationSceneManifest"; exit 1; }
            echo "$PLIST_XML" | grep -q "NSAllowsLocalNetworking" || { echo "::error::Info.plist missing NSAllowsLocalNetworking"; exit 1; }
            echo "$PLIST_XML" | grep -q "UIFileSharingEnabled" || { echo "::error::Info.plist missing UIFileSharingEnabled"; exit 1; }
            lipo -info "$TMP_CHECK/Payload/PokeBonkUnbound.app/PokeBonkUnbound" | grep -q "arm64"
            lipo -info "$TMP_CHECK/Payload/PokeBonkUnbound.app/Frameworks/NodeMobile.framework/NodeMobile" | grep -q "arm64"
            rm -rf "$TMP_CHECK"
            echo "OK: $ipa structure, Info.plist, and arm64 Mach-O binaries verified."
          done

      - name: Upload unsigned IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pokebonk-unbound-ios-ipa-${{ inputs.edition }}
          path: dist-ios/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload IPA(s) to experimental-apple GitHub release (optional)
        if: inputs.upload_to_release == true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        shell: bash
        run: |
          gh release upload experimental-apple dist-ios/*.ipa \
            --repo HyruleChosenOne/Pokebonk-Unbound \
            --clobber
